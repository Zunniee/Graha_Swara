<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products - Graha Swara</title>
  <link rel="stylesheet" href="web.css" />
  <link rel="stylesheet" href="animate.css">
  <script src="web.js" defer></script>
</head>
<body>
  <div id="layout"></div>

  <template id="page-content">
    <main class="mainproduct-content">
      <div id="products-page" class="products-page">  
        <div class="product-text">        
        <h1>Products</h1>
        <h2>Graha Swara: Edisi Rumah Joglo Adat Yogyakarta</h2>
        </div>



        <div class="displayed-product" id="displayed-product">
          <img id="displayed-image" src="assets/proto1.webp" alt="Product">
          <h2 id="displayed-name">Product 1</h2>
          <p id="displayed-description"></p>
        </div>

    
        
        <div class="product-selector-container">
          <div class="selector-bracket"></div>
          <div class="swipe-area" id="swipe-area"></div>
          <div class="product-list-page" id="product-list-page">
            <div class="product-item-page active" 
              data-index="0"
              data-name=" "
              data-image="assets/proto6.jpg"
              data-description="">
                <img src="assets/proto6.jpg" alt="Product6">
            </div>
            <div class="product-item-page" 
              data-index="1"
              data-name=""
              data-image="assets/proto2.jpg"
              data-description="">
              <img src="assets/proto2.jpg" alt="Product2">
            </div>
            <div class="product-item-page" 
              data-index="2"
              data-name=" "
              data-image="assets/proto3.jpg"
              data-description="">
              <img src="assets/proto3.jpg" alt="Product3">
            </div>
            <div class="product-item-page" 
              data-index="3"
              data-name=" "
              data-image="assets/proto4.jpg"
              data-description="">
              <img src="assets/proto4.jpg" alt="Product4">
            </div>
            <div class="product-item-page" 
              data-index="4"
              data-name=""
             data-image="assets/proto1.jpg"
              data-description="">
              <img src="assets/proto1.jpg" alt="Product1">
            </div>
            <div class="product-item-page" 
              data-index="5"
              data-name=""
              data-image="assets/proto5.jpg"
              data-description="">
              <img src="assets/proto5.jpg" alt="Product5">
            </div>
          </div>
        </div>
      </div>
    </main>
  </template>
</body>
</html>
