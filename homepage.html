<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Graha Swara</title>
  <link rel="stylesheet" href="web.css" />
  <link rel="stylesheet" href="animate.css">
  <script src="web.js" defer></script>
</head>
<body>
  <div id="layout"></div>

  <template id="page-content">
    <main class="main-content">
      <!-- Animation -->
      <section class="animated">
        <div class="image-stack">
          <img src="assets/bumi.PNG" class="bumi" alt="bumi" />
          <img src="assets/teks.PNG" class="teks" alt="teks" />
          <img src="assets/filler.PNG" class="filler" alt="filler" />
          <img src="assets/joglo.PNG" class="joglo" alt="joglo" />
          <img src="assets/honai.PNG" class="honai" alt="honai" />
          <img src="assets/tongkonan.PNG" class="tongkonan" alt="tongkonan" />
        </div>
      </section>

      <!-- Products -->
      <section id="products" class="products">
        <h1>Our Products</h1>
        <div class="product-list" id="product-list">
          <div class="product-item"><img src="img/product-placeholder1.jpg"><p>Product Name 1</p></div>
          <div class="product-item"><img src="img/product-placeholder2.jpg"><p>Product Name 2</p></div>
          <div class="product-item"><img src="img/product-placeholder1.jpg"><p>Product Name 3</p></div>
        </div>
        <a href="product.html" class="btn">View All Products</a>
      </section>

      <!-- Moments -->
      <section id="moments" class="moments">
        <h1>Moments</h1>
        <div class="moment-list" id="moment-list">
          <div class="moment-item"><img src="assets/moment1.jpeg"><p>Moment1</p></div>
          <div class="moment-item"><img src="assets/moment2.jpeg"><p>Moment2</p></div>
          <div class="moment-item"><img src="img/product-placeholder1.jpg"><p>Moment Name 3</p></div>
        </div>
        <a href="moment.html" class="btn">View All Moments</a>
      </section>
    </main>
  </template>  
</body>
</html>
